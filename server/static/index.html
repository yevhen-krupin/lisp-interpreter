<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/persist@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    body {
      background: #111;
      color: #ddd;
      font: 14px monospace;
    }

    .terminal {
      max-width: 80vw;
      margin: 40px auto;
      background: #181818;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 16px;
    }

    #output {
      height: 72vh;
      overflow: auto;
      white-space: pre-wrap;
    }

    input {
      background: none;
      border: 0;
      outline: 0;
      color: #7ee787;
      font: inherit;
      width: 90%;
    }

    .terminal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Modal Overlay Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: #1c1c1c;
      border: 1px solid #444;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .help-btn {
      background: #222;
      color: #8b949e;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    .help-btn:hover {
      color: #7ee787;
      border-color: #7ee787;
    }

    .close-btn {
      background: none;
      border: 0;
      color: #8b949e;
      cursor: pointer;
      font-size: 18px;
    }

    .close-btn:hover {
      color: #ff6b6b;
    }

    .help-grid {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 8px 16px;
      font-size: 13px;
    }

    .help-label {
      color: #7ee787;
    }
  </style>
</head>

<body>
  <div class="terminal" x-data="repl()" x-init="connect()">
    <div class="terminal-header" x-data="{ helpOpen: false }">
      <div><span style="color:#7ee787">●</span> REPL <span x-text="connected ? 'connected' : 'disconnected'"></span>
      </div>
      <button class="help-btn" @click="helpOpen = true">Help</button>
      <!-- Help Modal implementation using global Alpine state variables -->
      <div class="modal-overlay" x-show="helpOpen" x-transition.opacity @click.self="helpOpen = false"
        style="display: none;">
        <div class="modal-content" x-show="helpOpen" x-transition.scale.95>
          <div class="modal-header">
            <span style="font-weight: bold; color: #7ee787;">Lisp Interpreter Documentation</span>
            <button class="close-btn" @click="helpOpen = false">&times;</button>
          </div>

          <div class="help-grid">
            <div class="help-label">Types:</div>
            <div>int, string, bool</div>

            <div class="help-label">Operators:</div>
            <div>+, -, *, /, =, &lt;, &gt;, &lt;=, &gt;=</div>

            <div class="help-label">Expressions:</div>
            <div>(+ 1 2)<br>(&lt; 1 2)</div>

            <div class="help-label">Condition:</div>
            <div>(if (= 2 2) 1 2)</div>

            <div class="help-label">Functions:</div>
            <div>(defun doublen (n) (* n 2))<br>(doublen 2)</div>

            <div class="help-label">History:</div>
            <div>Use Up / Down arrow keys</div>
          </div>
        </div>
      </div>

    </div>
    <hr>
    <div id="output" x-ref="output" x-text="output"></div>
    <form @submit.prevent="send()">
      <span style="color:#7ee787">❯</span>
      <input x-model="command" x-ref="input" autofocus @keydown.up="up($event)" @keydown.down="down($event)"
        autocomplete="off" placeholder="Enter expression...">
    </form>
  </div>
  <footer
    style="background: #0d1117; color: #8b949e; border-top: 1px solid #30363d; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px;">
    <div
      style="margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;">
  <a href="https://github.com/yevhen-krupin/lisp-interpreter" target="_blank" rel="noopener noreferrer"
    aria-label="GitHub"
    style="color: #8b949e; display: flex; align-items: center; text-decoration: none; transition: color 0.2s;"
    onmouseover="this.style.color='#7ee787'" onmouseout="this.style.color='#8b949e'">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"></path></svg>
  </a>
    </div>
  </footer>
  <script>
    function repl() {
      return {
        ws: null,
        connected: false,
        command: '',
        output: '',
        index: -1,
        history: Alpine.$persist([]),

        up(e) {
          if (this.index + 1 < this.history.length) {
            this.command = this.history[this.index + 1]
            this.index = this.index + 1
          }
          setTimeout(function () { e.target.selectionStart = e.target.selectionEnd = 10000; }, 0);
        },
        down(e) {
          if (this.index - 1 >= 0) {
            this.command = this.history[this.index - 1]
            this.index = this.index - 1
          } else {
            this.command = ""
            this.index = -1
          }
          setTimeout(function () { e.target.selectionStart = e.target.selectionEnd = 10000; }, 0);
        },

        connect() {
          const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
          this.ws = new WebSocket(`${scheme}//${location.host}/repl`);
          this.ws.onopen = () => this.connected = true;
          this.ws.onclose = () => this.connected = false;
          this.ws.onmessage = e => {
            this.output += JSON.parse(e.data).resultString;
            this.$nextTick(() => {
              this.$refs.output.scrollTop = this.$refs.output.scrollHeight;
            });
          };
        },

        send() {
          const cmd = this.command;
          if (!cmd.trim() || !this.connected) return;
          if (this.history.indexOf(cmd) < 0) {
            this.history.unshift(cmd)
            while (this.history.length > 20) {
              this.history.pop()
            }
          }
          this.index = -1;
          this.output += `❯ ${cmd}\n`;
          this.ws.send(cmd);
          this.command = '';
        }
      };
    }
  </script>
</body>
</html>
